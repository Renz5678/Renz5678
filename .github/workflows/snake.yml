name: Generate Snake

on:
  schedule:
    - cron: "0 18 * * *"   # runs daily at 02:00 Manila time (18:00 UTC)
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: renz5678
          outputs: |
            dist/red-snake.svg?color_snake=%23FFD700&color_dots=%23161B22,%233A0A0A,%235C1010,%238B0000,%23E63946&color_dark_dots=%23161B22

      - name: Push output to "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
