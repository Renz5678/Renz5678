name: Generate Snake

on:
  schedule:
    - cron: "0 18 * * *"   # runs daily at 02:00 Manila time (18:00 UTC)
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: renz5678
          outputs: |
            dist/red-snake.svg?color_snake=%23FFD700&color_dots=%23000000,%23262626,%234D4D4D,%23999999,%23FFD700&color_dark_dots=%238B0000

      - name: Push output to "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
